# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# 禁用默认的 pwsh-sandbox（Windows 上默认的 shell 执行器）
- id: pwsh-sandbox
  disabled: true

# 禁用 permission-presets（演示插件没有完整沙箱实现）
- id: permission
  disabled: true

# 插入自定义 audited-shell 插件
- insert:
    - id: audited-shell
      name: './audited-shell.ts'
